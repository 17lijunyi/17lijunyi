name: Sync contribution calendar

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - contributions.json
      - scripts/sync_contributions.py
      - scripts/contributions_card.py
      - tests/test_sync_contributions.py
      - tests/test_contributions_card.py
      - .github/workflows/sync-contributions.yml

permissions:
  contents: write

concurrency:
  group: sync-contribution-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify contribution generator
        run: python3 -m unittest discover -s tests -p 'test_*contributions*.py' -v
      - name: Read GitHub contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_contributions.py
      - name: Commit changed calendar
        run: |
          git add README.md assets/contributions.svg assets/contributions-data.json
          if git diff --cached --quiet; then
            echo 'Contribution calendar is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync contribution calendar'
          git pull --rebase origin main
          git push origin HEAD:main
